[package]
name = "stm32_firmware"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { workspace = true }
fugit = "0.3.7"
stm32h7xx-hal = { workspace = true }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { version = "1", features = ["print-defmt"] }
rtic = { version = "2.0", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.0", features = ["cortex-m-systick"] }

[dependencies.pwm_tim1]
path = "../drivers/pwm_tim1"

[dependencies.spi_dma_ads131]
path = "../drivers/spi_dma_ads131"

[package.metadata.cortex-m-rt]
memory-x = true